<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gym Mapa</title>
<meta name="theme-color" content="#EDEFF2">
<style>
@font-face{font-family:Barlow;font-weight:400;font-style:normal;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Barlow;font-weight:500;font-style:normal;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Barlow;font-weight:600;font-style:normal;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:800;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-latin-800-normal.woff2) format("woff2")}
:root{
  --chalk:#EDEFF2; --paper:#FFFFFF; --plate:#E1E5EA; --ink:#1A2130; --steel:#5F6879;
  --line:#D3D8DF; --muscle:#D93A26; --muscle2:#F28C38; --body:#C3CAD4; --cobalt:#2341C9;
  --r-s:8px; --r-m:14px; --r-l:22px;
  --muscle3:#EDB93C; --hover:#AEB6C2; --hoverp:#B92E1C; --dangerbg:#FBE5E1; --danger:#A3271A; --fig:#8C95A3; --prop:#7A8291;
  color-scheme:light;
}
[data-theme="dark"]{
  --chalk:#1C2028; --paper:#262B34; --plate:#2E343E; --ink:#E9ECF1; --steel:#9CA5B4;
  --line:#3B424E; --muscle:#F0533C; --muscle2:#D9782E; --body:#4A5261; --cobalt:#7089FF;
  --muscle3:#B98A2A; --hover:#5D6676; --hoverp:#FF7560; --dangerbg:#3D2522; --danger:#FF9C8C; --fig:#6E7788; --prop:#8992A2;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--chalk);color:var(--ink)}
body{font-family:Barlow,system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:84px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding:0 18px}
h1,h2,h3,.cond{font-family:"Barlow Condensed",sans-serif;letter-spacing:.005em}

/* Header */
.top{padding:22px 0 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top h1{font-size:44px;line-height:.9;font-weight:800}
.save-note{font-size:13px;color:var(--steel);text-align:right;max-width:150px;line-height:1.25}

/* Body map plate */
.plate{background:var(--plate);border-radius:var(--r-l);padding:14px 10px 10px;margin-top:12px;position:relative}
.maps{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.map{display:flex;flex-direction:column;align-items:center}
.map svg{width:100%;max-width:190px;height:auto;display:block}
.map span{font-family:"Barlow Condensed";font-weight:600;font-size:15px;color:var(--steel);margin-top:2px}
.b{fill:var(--body)}
.m{fill:var(--body);stroke:var(--plate);stroke-width:.7;transition:fill .18s}
.m.p{fill:var(--muscle)}
.m.s{fill:var(--muscle2)}
.m.e{fill:var(--muscle3)}
.m.h1{fill:var(--muscle);fill-opacity:.3}
.m.h2{fill:var(--muscle);fill-opacity:.62}
.m.h3{fill:var(--muscle)}
.m.sel{fill:var(--muscle)}
.m.sel.s,.m.sel.e{fill:var(--muscle)}
.mlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.mlist button{padding:5px 10px;border-radius:999px;background:var(--paper);font-size:14px}
.errs{margin-top:16px;background:var(--dangerbg);border-radius:var(--r-m);padding:12px 14px}
.errs h3{font-size:19px;color:var(--danger)}
.errs li{margin:4px 0 0 18px;font-size:15px}
.mus3{display:grid;gap:8px;margin-top:16px}
.mus3 div{background:var(--chalk);border-radius:var(--r-m);padding:10px 12px}
.mus3 h3{font-size:17px;display:flex;align-items:center;gap:6px}
.mus3 h3 i{width:10px;height:10px;border-radius:3px;display:inline-block}
.mus3 .mlist button{background:var(--paper)}
.ginfo{font-size:15px;margin-top:10px}
.m.hit{cursor:pointer}
.m.hit:hover{fill:var(--hover)}
.m.hit.p:hover{fill:var(--hoverp)}
.anim{background:var(--plate);border-radius:var(--r-l);margin-top:14px;position:relative;padding:8px}
.anim svg{width:100%;height:auto;display:block;max-height:300px}
.anim .play{position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:50%;background:var(--paper);display:grid;place-items:center;color:var(--ink)}
.anim .play svg{width:16px;height:16px}
.fig-note{font-size:13px;color:var(--steel);margin-top:6px;text-align:center}
.m.hit:focus{outline:none}
.m.hit:focus-visible{stroke:var(--cobalt);stroke-width:1.6}
.legend{display:flex;gap:14px;justify-content:center;font-size:13px;color:var(--steel);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.linkbtn{color:var(--cobalt);font-weight:600;text-decoration:underline;font-size:14px}
.hint{text-align:center;font-size:14px;color:var(--steel);margin-top:4px}

/* Filters */
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 18px 4px;margin:0 -18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;background:var(--paper);border:1px solid var(--line);font-size:14px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--chalk);border-color:var(--ink)}
.search{width:100%;margin-top:10px;padding:12px 14px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--paper)}
.count{font-size:14px;color:var(--steel);margin:14px 2px 6px}

/* Exercise list */
.list{background:var(--paper);border-radius:var(--r-m);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;border-bottom:1px solid var(--chalk)}
.row:last-child{border-bottom:0}
.row:active{background:var(--chalk)}
.row .dot{flex:none;width:38px;height:38px;border-radius:10px;background:var(--chalk);display:grid;place-items:center}
.row .dot svg{width:30px;height:auto}
.row b{display:block;font-weight:600;font-size:16px;line-height:1.2}
.row small{color:var(--steel);font-size:13.5px}
.row .chev{margin-left:auto;color:var(--line);font-size:20px}
.empty{padding:28px 18px;text-align:center;color:var(--steel)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(26,33,48,.45);display:none;z-index:20}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--paper);border-radius:var(--r-l) var(--r-l) 0 0;z-index:21;transform:translateY(100%);transition:transform .25s ease;padding:10px 0 calc(24px + env(safe-area-inset-bottom))}
.sheet.open{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet h2{font-size:32px;line-height:1;font-weight:700}
.sheet .eq{color:var(--steel);margin-top:4px}
.sheet .plate{margin-top:14px}
.mus{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.mus div{background:var(--chalk);border-radius:var(--r-m);padding:12px}
.mus h3{font-size:17px;font-weight:700;display:flex;align-items:center;gap:6px}
.mus h3 i{width:10px;height:10px;border-radius:3px;display:inline-block}
.mus p{font-size:15px;margin-top:2px}
.steps{margin-top:18px;padding-left:20px}
.steps li{margin-bottom:8px}
.steps li::marker{font-family:"Barlow Condensed";font-weight:700;color:var(--muscle)}
.tip{margin-top:6px;font-size:15px;color:var(--steel);border-left:3px solid var(--muscle2);padding-left:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:var(--r-m);font-weight:600;background:var(--cobalt);color:#fff;width:100%;margin-top:18px}
.btn.ghost{background:var(--chalk);color:var(--ink)}
.btn.danger{background:var(--dangerbg);color:var(--danger)}
.close{position:absolute;right:14px;top:12px;width:36px;height:36px;border-radius:50%;background:var(--chalk);font-size:20px;line-height:1}

/* Routines */
.sec-title{font-size:30px;font-weight:700;margin:20px 0 4px}
.sub{color:var(--steel)}
.rcard{display:block;width:100%;text-align:left;background:var(--paper);border-radius:var(--r-m);padding:14px;margin-top:10px;display:flex;gap:12px;align-items:center}
.rcard .mini{flex:none;display:flex;gap:2px;background:var(--plate);border-radius:10px;padding:4px}
.rcard .mini svg{width:30px;height:auto}
.rcard b{font-family:"Barlow Condensed";font-size:22px;font-weight:700;display:block;line-height:1.05}
.rcard small{color:var(--steel);font-size:14px}
.name-in{width:100%;font-family:"Barlow Condensed";font-weight:700;font-size:32px;border:0;border-bottom:2px solid var(--line);background:transparent;padding:4px 0}
.name-in:focus{outline:none;border-color:var(--cobalt)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--cobalt);font-weight:600;margin-top:18px}
.item{background:var(--paper);border-radius:var(--r-m);padding:12px 14px;margin-top:10px}
.item-h{display:flex;align-items:center;gap:8px}
.item-h b{font-weight:600;flex:1;line-height:1.2}
.item-h b small{display:block;font-weight:400;color:var(--steel);font-size:13.5px}
.ic{width:34px;height:34px;border-radius:9px;background:var(--chalk);display:grid;place-items:center;font-size:16px;color:var(--steel)}
.ic:disabled{opacity:.35;cursor:default}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.nums label{font-size:12.5px;color:var(--steel);display:block}
.nums input{width:100%;padding:9px 10px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--chalk);font-weight:600;font-size:16px}
.confirm{background:var(--dangerbg);border-radius:var(--r-m);padding:14px;margin-top:14px}
.confirm p{font-weight:500}
.confirm .row2{display:flex;gap:8px}
.confirm .btn{margin-top:10px}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:center;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:10}
.nav button{flex:1;max-width:200px;padding:9px;border-radius:var(--r-m);font-family:"Barlow Condensed";font-size:19px;font-weight:700;color:var(--steel)}
.nav button[aria-current="page"]{background:var(--ink);color:var(--chalk)}
.nav .theme{flex:none;width:48px;display:grid;place-items:center;color:var(--ink);background:var(--chalk)}
.nav .theme svg{width:20px;height:20px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--chalk);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
.toast.show{opacity:1}
/* Week + today */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.wd{background:var(--paper);border-radius:12px;padding:8px 0 12px;text-align:center;font-family:"Barlow Condensed";font-weight:700;font-size:17px;color:var(--steel);position:relative}
.wd.has::after{content:"";position:absolute;bottom:5px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--muscle)}
.wd.today{background:var(--ink);color:var(--chalk)}
.today-card{background:var(--paper);border-radius:var(--r-m);padding:14px;margin-top:10px}
.today-card p{color:var(--steel);font-size:15px}
.today-card h3{font-size:24px;line-height:1.1;margin-top:2px}
.today-card .btn{margin-top:12px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns .btn{margin-top:12px}
.lbl{font-size:14px;color:var(--steel);margin-top:16px}
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px}
.daypick button{padding:9px 0;border-radius:10px;background:var(--paper);border:1px solid var(--line);font-weight:600;font-size:14px}
.sheet .daypick button{background:var(--chalk)}
.daypick button[aria-pressed="true"]{background:var(--ink);color:var(--chalk);border-color:var(--ink)}
/* Generator */
.qstep{color:var(--steel);font-size:14px}
.opts{display:grid;gap:8px;margin-top:14px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{text-align:left;padding:13px 14px;border-radius:var(--r-m);background:var(--chalk);border:2px solid transparent}
.opt b{display:block;font-weight:600}
.opt small{color:var(--steel);font-size:14px}
.opt[aria-pressed="true"]{border-color:var(--cobalt)}
.navbtns{display:flex;gap:8px}
.navbtns .btn{flex:1}
.gen-r{background:var(--chalk);border-radius:var(--r-m);padding:12px 14px;margin-top:10px}
.gen-r h3{font-size:21px;line-height:1.1}
.gen-r .meta{color:var(--steel);font-size:14px;margin-bottom:6px}
.gen-r li{list-style:none;font-size:15px;display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid var(--line)}
.gen-r li span{color:var(--steel);white-space:nowrap}
/* Workout */
.wk-top{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px}
.wk-top .back{margin-top:0}
.wk-count{font-size:14px;color:var(--steel)}
.prog{height:6px;background:var(--plate);border-radius:3px;margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--muscle);transition:width .3s}
.wk h2{font-size:32px;line-height:1;margin-top:14px}
.target{color:var(--steel);margin-top:4px}
.setrow{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:8px;align-items:end;background:var(--paper);border-radius:12px;padding:10px 12px;margin-top:8px}
.setrow .n{font-family:"Barlow Condensed";font-weight:700;font-size:22px;align-self:center}
.setrow label{font-size:12px;color:var(--steel);display:block}
.setrow input{width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--chalk);font-weight:600;font-size:16px}
.check{width:48px;height:42px;border-radius:10px;background:var(--chalk);border:2px solid var(--line);font-size:20px;font-weight:700;color:var(--steel)}
.setrow.done .check{background:var(--muscle);border-color:var(--muscle);color:#fff}
.timer{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));background:var(--cobalt);color:#fff;display:none;align-items:center;gap:10px;padding:10px 18px;z-index:12}
.timer.on{display:flex}
.timer.end{background:var(--muscle)}
.timer b{font-family:"Barlow Condensed";font-size:32px;font-variant-numeric:tabular-nums;min-width:64px;line-height:1}
.timer .tl{flex:1;font-size:14px;line-height:1.2}
.timer button{background:rgba(255,255,255,.2);color:#fff;padding:8px 12px;border-radius:10px;font-weight:600}
/* History */
.hist{margin-top:20px}
.hist h3{font-size:22px}
.hist .spark{background:var(--chalk);border-radius:var(--r-m);padding:10px;margin-top:8px}
.hist svg{width:100%;height:auto;display:block}
.hist ul{list-style:none;margin-top:8px}
.hist li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--chalk);font-size:15px}
.hist li span{color:var(--steel)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<nav class="nav" aria-label="Secciones">
  <button id="nav-ex" data-tab="ex">Ejercicios</button>
  <button id="nav-ru" data-tab="ru">Mis rutinas</button>
  <button class="theme" id="theme" data-act="theme" aria-label="Cambiar modo"></button>
</nav>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
<div class="toast" id="toast" role="status"></div>
<div class="timer" id="timer" role="timer"><b id="tnum">1:30</b><span class="tl" id="tlbl">Descanso</span><button data-act="t15">+15 s</button><button data-act="tskip">Saltar</button></div>

<script>
const MUS={
 pec_sup:{n:'Pectoral superior',g:'pecho',v:'front',i:'La parte alta del pecho, junto a la clavícula. Lleva el brazo hacia delante y hacia arriba. Se trabaja más con presses e inclinados.'},
 pec_inf:{n:'Pectoral medio e inferior',g:'pecho',v:'front',i:'La mayor parte del pecho. Junta los brazos delante del cuerpo y empuja. Es el motor del press de banca y las flexiones.'},
 serrato:{n:'Serrato anterior',g:'pecho',v:'front',i:'Los "dedos" a los lados de las costillas. Pega la escápula al tórax y la mueve hacia delante; protege el hombro al empujar.'},
 delt_ant:{n:'Deltoides anterior',g:'hombros',v:'front',i:'La parte delantera del hombro. Sube el brazo hacia delante. Trabaja en todos los presses de pecho y de hombro.'},
 delt_lat:{n:'Deltoides lateral',g:'hombros',v:'both',i:'La parte de fuera del hombro. Sube el brazo hacia el lado y es la que da anchura a los hombros.'},
 delt_post:{n:'Deltoides posterior',g:'hombros',v:'back',i:'La parte trasera del hombro. Lleva el brazo hacia atrás. Muy importante para la postura y la salud del hombro.'},
 trap_sup:{n:'Trapecio superior',g:'espalda',v:'both',i:'Entre el cuello y el hombro. Eleva los hombros, como al encogerlos.'},
 trap_med:{n:'Trapecio medio e inferior',g:'espalda',v:'back',i:'El centro de la espalda alta. Junta y baja las escápulas; clave para una buena postura.'},
 romboides:{n:'Romboides',g:'espalda',v:'back',i:'Entre las escápulas, debajo del trapecio. Junta las escápulas al hacer remos.'},
 dorsal:{n:'Dorsal ancho',g:'espalda',v:'back',i:'El músculo más grande de la espalda. Lleva los brazos hacia abajo y atrás, y da la forma de "V".'},
 erectores:{n:'Erectores (lumbares)',g:'espalda',v:'back',i:'Dos columnas a lo largo de la columna. Mantienen la espalda recta y la extienden.'},
 biceps:{n:'Bíceps',g:'brazos',v:'front',i:'La parte delantera del brazo. Dobla el codo y gira la palma hacia arriba.'},
 braquial:{n:'Braquial',g:'brazos',v:'front',i:'Debajo del bíceps. Es el flexor de codo más fuerte; se trabaja mucho con el curl martillo.'},
 triceps:{n:'Tríceps',g:'brazos',v:'back',i:'La parte trasera del brazo, con tres cabezas. Estira el codo y es 2/3 del volumen del brazo.'},
 ante_flex:{n:'Flexores del antebrazo',g:'brazos',v:'front',i:'La cara interna del antebrazo. Cierran la mano y doblan la muñeca: dan fuerza de agarre.'},
 ante_ext:{n:'Extensores del antebrazo',g:'brazos',v:'both',i:'La cara externa del antebrazo. Abren la mano y estiran la muñeca; equilibran el agarre.'},
 recto:{n:'Recto abdominal',g:'abdomen',v:'front',i:'La "tableta". Dobla el tronco hacia delante y estabiliza la columna.'},
 oblicuos:{n:'Oblicuos',g:'abdomen',v:'front',i:'A los lados del abdomen. Giran e inclinan el tronco y evitan que se tuerza.'},
 gluteo_may:{n:'Glúteo mayor',g:'gluteos',v:'back',i:'El músculo más grande del cuerpo. Extiende la cadera: levantarse, subir escaleras, saltar.'},
 gluteo_med:{n:'Glúteo medio',g:'gluteos',v:'both',i:'En la parte alta y lateral de la cadera. Abre la pierna y estabiliza la cadera al caminar.'},
 cuadriceps:{n:'Cuádriceps',g:'piernas',v:'front',i:'La parte delantera del muslo, con cuatro cabezas. Estira la rodilla.'},
 aductores:{n:'Aductores',g:'piernas',v:'both',i:'La cara interna del muslo. Juntan las piernas y ayudan en sentadillas.'},
 isquios:{n:'Isquiotibiales',g:'piernas',v:'back',i:'La parte trasera del muslo. Doblan la rodilla y extienden la cadera.'},
 gemelos:{n:'Gemelos',g:'piernas',v:'back',i:'La parte alta de la pantorrilla. Te ponen de puntillas con la rodilla estirada.'},
 soleo:{n:'Sóleo',g:'piernas',v:'back',i:'Debajo de los gemelos. Te pone de puntillas, sobre todo con la rodilla doblada.'},
 tibial:{n:'Tibial anterior',g:'piernas',v:'front',i:'Delante de la espinilla. Levanta la punta del pie; ayuda a prevenir dolor de espinillas.'}
};
const MUSCLES=Object.fromEntries(Object.entries(MUS).map(([k,v])=>[k,v.n]));
const GROUPS={pecho:'Pecho',hombros:'Hombros',espalda:'Espalda',brazos:'Brazos',abdomen:'Abdomen',gluteos:'Glúteos',piernas:'Piernas'};

  });

let anim={raf:0,paused:false,t0:0,off:0,ex:null};
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const PLAY='<svg viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z" fill="currentColor"/></svg>',PAUSE='<svg viewBox="0 0 16 16"><rect x="3" y="2" width="3.5" height="12" fill="currentColor"/><rect x="9.5" y="2" width="3.5" height="12" fill="currentColor"/></svg>';
function phase(now){const d=(PAT[EXPAT[anim.ex.id]].dur||2600);return (1-Math.cos(2*Math.PI*((now-anim.t0+anim.off)%d)/d))/2}
function startAnim(ex){
  stopAnim();anim.ex=ex;anim.paused=reduceMotion;anim.t0=performance.now();anim.off=0;
  const box=$('#fig');if(!box)return;
  if(anim.paused){box.innerHTML=figSVG(ex,1);updPlay();return}
  const loop=now=>{const b=$('#fig');if(!b)return;b.innerHTML=figSVG(ex,phase(now));anim.raf=requestAnimationFrame(loop)};
  anim.raf=requestAnimationFrame(loop);updPlay();
}
function stopAnim(){cancelAnimationFrame(anim.raf);anim.raf=0}
function updPlay(){const b=$('#playbtn');if(b){b.innerHTML=anim.paused?PLAY:PAUSE;b.setAttribute('aria-label',anim.paused?'Reproducir animación':'Pausar animación')}}
function togglePlay(){
  if(anim.paused){anim.paused=false;anim.t0=performance.now();const loop=now=>{const b=$('#fig');if(!b)return;b.innerHTML=figSVG(anim.ex,phase(now));anim.raf=requestAnimationFrame(loop)};anim.raf=requestAnimationFrame(loop)}
  else{anim.paused=true;anim.off+=performance.now()-anim.t0;stopAnim()}
  updPlay();
}

function persist(id){
  saveLocal();

async function flush(id){
  if(inflight[id]){dirty[id]=true;return}

  try{const r=S.routines[id]; if(r) await col.doc(id).set(JSON.parse(JSON.stringify(r)));}
  catch(e){if(e&&e.code==='invalid_argument'){col=null;sessCol=null;S.mode='local';safeRender()}else toast(e&&e.code==='quota_exceeded'?'Sin espacio: borra alguna rutina':'No se pudo guardar. Revisa tu conexión.')}
  inflight[id]=false;

}

  const q=norm(S.q.trim()),ks=selKeys();

    if(ks.length && !hits(e,e.p) && !hits(e,e.s)) return false;

const T={end:0,int:0};let actx=null;
function ensureAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}

  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function startTimer(sec){ensureAudio();T.end=Date.now()+sec*1000;const el=$('#timer');el.classList.add('on');el.classList.remove('end');clearInterval(T.int);T.int=setInterval(tick,250);tick()}
function tick(){

}

const TPL={
 full:['squat','chest','pullh','hinge','pushv','pullv','lunge','core','biceps','tri'],
 upper:['chest','pullh','pushv','pullv','chestiso','delt','biceps','tri','core'],
 lower:['squat','hinge','lunge','glute','hamiso','quadiso','calf','core'],
 push:['chest','pushv','chest','delt','tri','chestiso','tri','core'],
 pull:['pullv','pullh','pullh','delt','biceps','biceps','trap','core'],
 legs:['squat','hinge','lunge','quadiso','hamiso','glute','calf','core']
};
const ALLOWED={full:Object.keys(TPL).flatMap(k=>TPL[k]),upper:TPL.upper,lower:TPL.lower.concat('adductor','abd'),push:TPL.push,pull:TPL.pull.concat('forearm'),legs:TPL.legs.concat('adductor','abd')};
const TNAME={full:'Cuerpo completo',upper:'Torso',lower:'Pierna',push:'Empuje',pull:'Tirón',legs:'Pierna'};
const SPLIT={1:['full'],2:['full','full'],3:['full','full','full'],4:['upper','lower','upper','lower'],5:['push','pull','legs','upper','lower'],6:['push','pull','legs','push','pull','legs'],7:['push','pull','legs','push','pull','legs','full']};
const FOCUS={pecho:['chestiso'],espalda:['pullh'],hombros:['delt'],brazos:['biceps','tri'],piernas:['quadiso','hamiso'],gluteos:['glute','abd'],abdomen:['core']};
const FOCUSL={pecho:'Pecho',espalda:'Espalda',hombros:'Hombros',brazos:'Brazos',piernas:'Piernas',gluteos:'Glúteos',abdomen:'Abdomen'};
const COMPOUND=['squat','hinge','chest','pullh','pullv','pushv','lunge'];
const COUNT={30:4,45:5,60:6,90:8};
function avail(e,eq){if(eq==='gym')return true;if(eq==='manc')return e.eq==='Mancuernas'||e.eq==='Peso corporal'||e.bw;return e.eq==='Peso corporal'||e.bw}
function dose(e,g){
  const comp=COMPOUND.includes(e.k),lv=g.level;
  if(e.k==='core') return {sets:lv==='principiante'?'2':'3',reps:e.id==='plancha'?(lv==='avanzado'?'45-60 s':'30-45 s'):e.id==='russian-twist'?'20':'12-15',rest:'45'};
  const base={principiante:3,intermedio:4,avanzado:4}[lv];
  switch(g.goal){
    case 'fuerza':return comp?{sets:String(lv==='avanzado'?5:base),reps:lv==='principiante'?'6-8':'4-6',rest:'180'}:{sets:'3',reps:'8-10',rest:'90'};
    case 'grasa':return {sets:'3',reps:comp?'10-12':'12-15',rest:comp?'60':'45'};
    case 'resistencia':return {sets:lv==='principiante'?'2':'3',reps:'15-20',rest:comp?'45':'30'};
    default:return comp?{sets:String(base),reps:'8-10',rest:'120'}:{sets:'3',reps:'10-12',rest:'75'};
  }
}
function generate(g){
  const days=g.days.slice().sort((a,b)=>a-b),types=SPLIT[Math.min(days.length,7)];
  const N=COUNT[g.time]-(g.level==='principiante'&&g.time>=60?1:0);
  const occ={},out=[];
  types.forEach((type,di)=>{
    const o=occ[type]=(occ[type]||0);occ[type]++;
    let slots=TPL[type].slice();
    const ins=[];g.focus.forEach(z=>FOCUS[z].forEach(s=>{if(ALLOWED[type].includes(s))ins.push(s)}));
    slots=slots.slice(0,2).concat(ins,slots.slice(2));
    const used=new Set(),items=[];
    for(const slot of slots){
      if(items.length>=N)break;
      let c=EX.filter(e=>e.k===slot&&avail(e,g.equip)&&!used.has(e.id));
      const easy=c.filter(e=>!(g.level==='principiante'&&e.adv));if(easy.length)c=easy;
      if(!c.length)continue;
      const e=c[(o+g.seed+di)%c.length];used.add(e.id);
      items.push({ex:e.id,...dose(e,g)});
    }
    const same=types.filter(t=>t===type).length>1;
    out.push({name:TNAME[type]+(same?' '+'ABC'[o]:''),days:[days[di]],items});
  });
  return out;
}
const GSTEPS=['days','time','goal','level','equip','focus','result'];

  }

function histHTML(exId){
  const h=history(exId);if(!h.length)return `<div class="hist"><h3>Tu progreso</h3><p class="sub">Cuando hagas este ejercicio en un entrenamiento, aquí verás tus pesos.</p></div>`;

  if(max>0&&pts.length>1){
    const W=300,H=110,pl=34,pr=12,pt=12,pb=22,rng=(max-min)||1;

      <line x1="${pl}" y1="${Y(max)}" x2="${W-pr}" y2="${Y(max)}" stroke="var(--line)" stroke-dasharray="3 3"/><line x1="${pl}" y1="${Y(min)}" x2="${W-pr}" y2="${Y(min)}" stroke="var(--line)" stroke-dasharray="3 3"/>
      <text x="${pl-6}" y="${Y(max)+4}" text-anchor="end" font-size="11" fill="var(--steel)">${max}</text><text x="${pl-6}" y="${Y(min)+4}" text-anchor="end" font-size="11" fill="var(--steel)">${min}</text>
      <polyline fill="none" stroke="var(--muscle)" stroke-width="2.5" stroke-linejoin="round" points="${pts.map((p,i)=>X(i)+','+Y(p.best)).join(' ')}"/>
      ${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.best)}" r="3.5" fill="var(--muscle)"/>`).join('')}
      <text x="${pl}" y="${H-4}" font-size="11" fill="var(--steel)">${fmtDate(pts[0].date)}</text><text x="${W-pr}" y="${H-4}" text-anchor="end" font-size="11" fill="var(--steel)">${fmtDate(pts[pts.length-1].date)}</text>
    </svg><p class="fig-note" style="margin-top:2px">Peso máximo por sesión (kg)</p></div>`;
  }
  return `<div class="hist"><h3>Tu progreso</h3>${chart}<ul>${h.slice(-5).reverse().map(p=>`<li>${fmtDate(p.date)}<span>${p.sets.length} ${p.sets.length===1?'serie':'series'} · ${p.sets.map(s=>(s.w?s.w+' kg × ':'')+s.r).join(', ')}</span></li>`).join('')}</ul></div>`;
}

  if(d.addto){pickRoutineSheet(d.addto);return}
  if(d.put){const r=S.routines[d.put];r.items.push(newItem(d.ex2));touch(r);closeSheet();toast('Añadido a '+(r.name||'tu rutina'));safeRender();return}
  if(d.newwith){const id=newId();S.routines[id]={id,name:'Nueva rutina',items:[newItem(d.newwith)],updated:Date.now()};persist(id);closeSheet();S.tab='ru';S.editing=id;render();scrollTo(0,0);setTimeout(()=>{const n=$('#rname');n&&n.select()},50);return}
  if(d.start){startWorkout(d.start);return}
  if(d.chk!==undefined){toggleSet(+d.chk);return}
  if(d.rday!==undefined){const r=S.routines[S.editing],i=+d.rday;r.days=r.days||[];r.days=r.days.includes(i)?r.days.filter(x=>x!==i):r.days.concat(i);touch(r);t.setAttribute('aria-pressed',r.days.includes(i));return}
  if(d.gday!==undefined){const i=+d.gday,g=S.gen;g.days=g.days.includes(i)?g.days.filter(x=>x!==i):g.days.concat(i);genRerenderKeepScroll();return}
  if(d.gopt){const [f,v]=d.gopt.split(':');S.gen[f]=f==='time'?+v:v;genRerenderKeepScroll();return}
  if(d.gfocus){const g=S.gen,z=d.gfocus;g.focus=g.focus.includes(z)?g.focus.filter(x=>x!==z):g.focus.concat(z);genRerenderKeepScroll();return}
  if(d.open){S.editing=d.open;S.confirmDel=false;render();scrollTo(0,0);return}
  if(d.pick){const r=S.routines[S.editing];r.items.push(newItem(d.pick));touch(r);closeSheet();render();toast('Ejercicio añadido');return}
  if(d.mv){const r=S.routines[S.editing];const i=+t.closest('.item').dataset.i,j=i+ +d.mv;[r.items[i],r.items[j]]=[r.items[j],r.items[i]];touch(r);render();return}
  if(d.rm!==undefined){const r=S.routines[S.editing];r.items.splice(+t.closest('.item').dataset.i,1);touch(r);render();return}
  switch(d.act){
    case 'close':closeSheet();break;
    case 'gen':openGen();break;
    case 'gennext':if(S.gen.step===0&&!S.gen.days.length)break;S.gen.step++;renderGen();break;
    case 'genback':S.gen.step--;renderGen();break;
    case 'genregen':S.gen.seed++;genRerenderKeepScroll();break;
    case 'gensave':{const res=S.gen.res;res.forEach((r,i)=>{const id=newId()+i;S.routines[id]={id,name:r.name,days:r.days,items:r.items,updated:Date.now()+res.length-i};persist(id)});closeSheet();S.tab='ru';S.editing=null;render();scrollTo(0,0);toast(res.length===1?'Rutina creada':res.length+' rutinas creadas');break}
    case 'wkresume':S.wkOpen=true;render();scrollTo(0,0);break;
    case 'wkback':S.wkOpen=false;stopAnim();render();scrollTo(0,0);break;
    case 'wkprev':if(S.wk.i>0){S.wk.i--;S.wk.confirmExit=false;saveWk();render();scrollTo(0,0)}break;
    case 'wknext':S.wk.i++;S.wk.confirmExit=false;saveWk();render();scrollTo(0,0);break;
    case 'wkfinish':finishWorkout();break;
    case 'wkexit':S.wk.confirmExit=true;render();break;
    case 'wknoexit':S.wk.confirmExit=false;render();break;
    case 'wkyesexit':S.wk=null;S.wkOpen=false;saveWk();stopTimer();stopAnim();render();scrollTo(0,0);toast('Entrenamiento descartado');break;
    case 't15':T.end=Math.max(T.end,Date.now())+15000;$('#timer').classList.remove('end');if(!T.int){T.int=setInterval(tick,250)}tick();break;
    case 'tskip':stopTimer();break;
    case 'play':togglePlay();break;
    case 'theme':{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';applyTheme(t);try{localStorage.setItem(TKEY,t)}catch(e){}break}
    case 'new':{const id=newId();S.routines[id]={id,name:'',items:[],updated:Date.now()};persist(id);S.editing=id;render();setTimeout(()=>$('#rname').focus(),50);break}
    case 'back':S.editing=null;S.confirmDel=false;render();break;
    case 'add':pickExerciseSheet();break;
    case 'del':S.confirmDel=true;render();break;
    case 'nodel':S.confirmDel=false;render();break;
    case 'yesdel':{const id=S.editing;S.editing=null;S.confirmDel=false;removeRoutine(id);render();toast('Rutina borrada');break}
  }
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape')closeSheet();
  const m=ev.target.closest&&ev.target.closest('[data-muscle]');
  if(m&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();m.dispatchEvent(new MouseEvent('click',{bubbles:true}))}
});
$('#scrim').onclick=closeSheet;
const CapApp=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
if(CapApp) CapApp.addListener('backButton',()=>{
  if($('#sheet').classList.contains('open')){closeSheet();return}
  if(S.tab==='ru'&&S.wk&&S.wkOpen){S.wkOpen=false;stopAnim();render();return}
  if(S.tab==='ru'&&S.editing){S.editing=null;S.confirmDel=false;render();return}
  if(S.tab==='ru'){S.tab='ex';render();scrollTo(0,0);return}
  CapApp.exitApp();
});
render();
</script>
</body>
</html>
